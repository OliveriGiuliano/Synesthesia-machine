[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "synesthesia-machine"
version = "0.1.0"
description = "A visual video-to-MIDI instrument for Windows."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "License not yet selected; see LICENSE-or-NOTICE.md" }
authors = [{ name = "Synesthesia Machine contributors" }]
dependencies = [
    "av>=18.0,<19",
    "mido>=1.3.3,<2",
    "numpy>=2.2,<3",
    "opencv-python>=4.13,<4.14",
    "psutil>=7.2,<8",
    "pyside6>=6.10,<6.11",
    "python-rtmidi>=1.5.8,<2",
    "sounddevice>=0.5.5,<0.6",
]

[project.scripts]
synmachine = "synesthesia_machine.app.bootstrap:main"
test = "synesthesia_machine.app.dev_commands:test"
check = "synesthesia_machine.app.dev_commands:check"

[dependency-groups]
dev = [
    "pyright>=1.1.408,<2",
    "pytest>=9.0,<10",
    "ruff>=0.14,<0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synesthesia_machine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "LOG", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
include = ["src", "tools"]
exclude = [".venv", "build", "dist"]
extraPaths = ["src"]
pythonVersion = "3.12"
pythonPlatform = "Windows"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Several native Phase 0 libraries do not publish complete typing metadata.
reportMissingTypeStubs = "none"