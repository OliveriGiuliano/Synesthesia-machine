name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked development environment
        run: uv sync --locked --group dev

      - name: Run static checks
        run: uv run check

      - name: Type-check test call sites
        run: uv run pyright --project pyright-tests.json

      - name: Run test suite
        run: uv run pytest -q

      - name: Smoke-test the real application shell
        run: uv run synmachine --smoke-test
