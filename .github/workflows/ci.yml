name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system libraries for offscreen Qt, ALSA, and PortAudio
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 \
            libegl1 \
            libfontconfig1 \
            libfreetype6 \
            libglib2.0-0t64 \
            libgl1 \
            libxkbcommon0
        shell: bash

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked development environment
        run: uv sync --locked --group dev

      - name: Run static checks
        run: uv run check

      - name: Type-check test call sites
        run: uv run pyright --project pyright-tests.json

      - name: Run test suite
        run: uv run pytest -q

      - name: Smoke-test the real application shell
        run: uv run synmachine --smoke-test
